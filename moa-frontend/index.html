<!DOCTYPE html>
<html>
<body>
  <h2>Farmland Registration</h2>
  <form id="farmerForm">
    <label>Farmer Name: <input type="text" id="farmerName"></label><br>
    <label>Household Details: <input type="text" id="householdDetails"></label><br>
    <label>Farmland Details: <input type="text" id="farmlandDetails"></label><br>
    <button type="submit">Submit</button>
  </form>
  <script>
    document.getElementById("farmerForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const data = {
        farmerName: document.getElementById("farmerName").value,
        householdDetails: document.getElementById("householdDetails").value,
        farmlandDetails: document.getElementById("farmlandDetails").value
      };
      fetch("http://localhost:8030/services/test-service/applications", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      })
      .then(response => response.json())
      .then(data => alert("Submitted: " + JSON.stringify(data)))
      .catch(error => console.error("Error:", error));
    });
  </script>
</body>
</html>
